[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Güvenli varsayılanlar: ilk hatada dur, en fazla 1 hata göster, verbose
addopts =
    -v
    -x
    --maxfail=1
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --hypothesis-show-statistics

; pytest-timeout eklentisi gerekli
timeout = 10
timeout_method = thread

markers =
    property: Property-based tests using Hypothesis
    integration: Integration tests for cascade behaviors and complex workflows
    unit: Unit tests
    slow: Slow running tests

; TEST_DATABASE_URL buraya yazilmaz: yerelde backend/.env, CI'da workflow env'inden okunur.
env =
    FLASK_ENV=testing