name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: music_catalog_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Wait for MySQL
      run: |
        until mysqladmin ping -h 127.0.0.1 -P 3307 -u test_user -ptest_password --silent; do
          echo 'Waiting for MySQL...'
          sleep 2
        done
    
    - name: Initialize test database
      run: |
        cd backend
        mysql -h 127.0.0.1 -P 3307 -u test_user -ptest_password music_catalog_test < ../db/schema.sql
        mysql -h 127.0.0.1 -P 3307 -u test_user -ptest_password music_catalog_test < ../db/triggers.sql
        mysql -h 127.0.0.1 -P 3307 -u test_user -ptest_password music_catalog_test < ../db/views.sql
        mysql -h 127.0.0.1 -P 3307 -u test_user -ptest_password music_catalog_test < ../db/procedures.sql
    
    - name: Run unit tests
      run: |
        cd backend
        python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml
      env:
        FLASK_ENV: testing
        TEST_DATABASE_URL: mysql+pymysql://test_user:test_password@127.0.0.1:3307/music_catalog_test
        CI: true
    
    - name: Run property-based tests
      run: |
        cd backend
        python -m pytest tests/test_core_properties.py -v --tb=short -m property
      env:
        FLASK_ENV: testing
        TEST_DATABASE_URL: mysql+pymysql://test_user:test_password@127.0.0.1:3307/music_catalog_test
        CI: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint || true  # Don't fail CI on linting errors initially

  integration-test:
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: music_catalog_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd backend && pip install -r requirements.txt
        cd ../frontend && npm ci
    
    - name: Wait for MySQL and initialize
      run: |
        until mysqladmin ping -h 127.0.0.1 -P 3307 -u test_user -ptest_password --silent; do
          echo 'Waiting for MySQL...'
          sleep 2
        done
        cd backend
        mysql -h 127.0.0.1 -P 3307 -u test_user -ptest_password music_catalog_test < ../db/schema.sql
        mysql -h 127.0.0.1 -P 3307 -u test_user -ptest_password music_catalog_test < ../db/triggers.sql
        mysql -h 127.0.0.1 -P 3307 -u test_user -ptest_password music_catalog_test < ../db/views.sql
        mysql -h 127.0.0.1 -P 3307 -u test_user -ptest_password music_catalog_test < ../db/procedures.sql
    
    - name: Run integration tests
      run: |
        cd backend
        python -m pytest tests/ -v --tb=short -m integration
      env:
        FLASK_ENV: testing
        TEST_DATABASE_URL: mysql+pymysql://test_user:test_password@127.0.0.1:3307/music_catalog_test